<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>API Yönetim Paneli</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 40px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
      }
      h2 {
        color: #38bdf8;
        border-bottom: 1px solid #334155;
        padding-bottom: 10px;
      }
      .api-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        background: #0f172a;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      .api-info strong {
        color: #f8fafc;
        font-size: 18px;
        display: block;
      }
      .api-info span {
        color: #94a3b8;
        font-size: 13px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }
      input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
        outline: none;
      }
      input:focus {
        border-color: #38bdf8;
      }
      button {
        background: #10b981;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        margin-top: 20px;
        font-size: 16px;
      }
      button:hover {
        background: #059669;
      }
      .nav {
        margin-bottom: 20px;
      }
      .nav a {
        color: #38bdf8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav"><a href="/">&larr; Yeni API Oluşturucuya Dön</a></div>
      <h2>Kayıtlı API'ler</h2>

      <div id="apiList">Yükleniyor...</div>

      <label>Şifre</label>
      <input
        type="password"
        id="password"
        placeholder="Girmeniz gereken şifre: asuria"
      />

      <button onclick="kaydet()" id="saveBtn">Değişiklikleri Kaydet</button>
    </div>

    <script>
      let mevcutApiler = [];

      // Sayfa açıldığında API'leri getir
      async function yukle() {
        const res = await fetch("/api/manage");
        mevcutApiler = await res.json();

        const listeDiv = document.getElementById("apiList");
        listeDiv.innerHTML = "";

        if (mevcutApiler.length === 0) {
          listeDiv.innerHTML = "<p>Henüz oluşturulmuş bir API yok.</p>";
          return;
        }

        mevcutApiler.forEach((api, index) => {
          listeDiv.innerHTML += `
                    <div class="api-item">
                        <div class="api-info">
                            <strong>${api.apiName}</strong>
                            <span>Asıl Adres: ${api.targetUrl}</span><br>
                            <span>Senin Adresin: /api/${api.slug}</span>
                        </div>
                        <div class="actions">
                            <label style="color: ${api.isActive ? "#10b981" : "#ef4444"}">
                                ${api.isActive ? "Aktif" : "Kapalı"}
                            </label>
                            <!-- Checkbox: onChange ile listedeki değeri anında güncelliyoruz -->
                            <input type="checkbox" ${api.isActive ? "checked" : ""} 
                                   onchange="durumDegistir(${index}, this.checked)">
                        </div>
                    </div>
                `;
        });
      }

      function durumDegistir(index, isChecked) {
        mevcutApiler[index].isActive = isChecked;
      }

      // Kaydet butonuna basıldığında
      async function kaydet() {
        const btn = document.getElementById("saveBtn");
        btn.innerText = "Kaydediliyor...";
        btn.style.background = "#fbbf24";

        const res = await fetch("/api/manage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            apis: mevcutApiler,
            password: document.getElementById("password").value,
          }),
        });

        if (res.ok) {
          btn.innerText = "Başarıyla Kaydedildi!";
          btn.style.background = "#10b981";
          setTimeout(() => {
            btn.innerText = "Değişiklikleri Kaydet";
            yukle();
          }, 2000);
        } else {
          btn.innerText = "Hata Oluştu";
          btn.style.background = "#ef4444";
        }
      }

      yukle();
    </script>
  </body>
</html>
