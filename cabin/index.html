<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabin</title>
<!--
  Web build of a scene recreated from the "arkaplam" Wallpaper Engine wallpaper.
  Artwork by Jeff Ostberg  - https://instagram.com/jeffelicious
  Original wallpaper       - steam://url/CommunityFilePage/2911866381
  Music in the original by dryhope - https://www.youtube.com/watch?v=QEWV6fiYaDU
  Fonts in assets/fonts/ ship under the SIL Open Font License (see that folder).
-->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b1016;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* Clock fonts. Use the family name (left side) in TUNE.clock.font.
     "Alcubierre" is the font the original scene wallpaper used. */
  @font-face { font-family: 'Alcubierre';  src: url('assets/fonts/Alcubierre.otf'); }
  @font-face { font-family: 'Segment7';    src: url('assets/fonts/Segment7Standard.otf'); }
  @font-face { font-family: 'CursedTimer'; src: url('assets/fonts/CursedTimerUlil-Aznm.ttf'); }
  @font-face { font-family: 'RobotoMono';  src: url('assets/fonts/RobotoMono-Regular.ttf'); }
  @font-face { font-family: 'Pixel8bit';   src: url('assets/fonts/8bitOperatorPlus8-Regular.ttf'); }
  @font-face { font-family: 'Monofur';     src: url('assets/fonts/Monofur-PK7og.ttf'); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===========================================================================
// Recreation of the "arkaplam" scene wallpaper as a web wallpaper.
// Artwork extracted from the original scene's .tex files into assets/.
// Scene space is the original 3840x2160 ortho projection; coordinates and
// draw order below follow scene.json (WE's bottom-left origin converted to
// canvas top-left with y_canvas = 2160 - y_we).
// ===========================================================================
var SCENE_W = 3840, SCENE_H = 2160;

var settings = {
  timeofday: 0,      // 0 auto, 1 day, 2 night
  dayTime:   7,
  nightTime: 18,
  weather:   0,      // 0 rain, 1 snow, 2 none
  clock:     true,
  use24h:    true,
  bars:      true,
  audioReact: true,
  sensitivity: 1.0
};

// Images and music are served from Vercel Blob so they stay out of the git
// repo. To run fully local instead, put the files back under assets/ and
// change this one line to:  var ASSET_BASE = 'assets/';
// Must stay ABOVE the TUNE block, which builds the audio URL from it.
var ASSET_BASE = 'https://cyknm8vnpbjgqn6i.public.blob.vercel-storage.com/assets/';

// ===========================================================================
// TUNING BLOCK - everything you might want to nudge lives here.
// All x/y are in SCENE coordinates: 0,0 is the TOP-LEFT of the 3840x2160
// artwork, x grows right, y grows DOWN. So y:1917 is near the bottom.
// Change a number, save, refresh. Nothing else in the file needs touching.
// ===========================================================================
var TUNE = {
  // --- audio in the browser (ignored when running inside Wallpaper Engine) ---
  webAudio: {
    enabled: true,
    source: 'file',              // 'file' = play a track | 'mic' = listen to the microphone
    file: ASSET_BASE + 'audio/carmen.mp3',
    volume: 0.6,                 // 0..1, only used for 'file'
    hint: true                   // show the small "click for music" line
  },

  // --- clock ---
  clock: {
    x: 444, y: 1276,     // position of the CENTRE of the text
    size: 132,           // font size in scene units
    font: 'Alcubierre',  // Alcubierre | Segment7 | CursedTimer | RobotoMono |
                         // Pixel8bit | Monofur | or any font installed on Windows
    weight: '600',       // '400' normal, '600' semibold, '700' bold
    color: 'rgba(255,238,214,0.93)',
    shadow: 26,          // drop-shadow softness, 0 turns it off
    align: 'center'      // 'center' | 'left' | 'right' (x is the anchor)
  },

  // --- easter egg: click the mug to switch to snow ---
  easter: {
    enabled: true,
    x: 2044, y: 1917,    // mug position (same anchor as the mug steam)
    radius: 160,         // how close a click has to be, in scene units
    debug: false         // true draws the clickable circle so you can aim it
  },

  // --- audio rings around the two speakers ---
  ring: {
    radius: 55,         // ring size (you liked this one). lower = smaller
    wobble: 0.34,        // how far the spectrum pushes the edge in/out
    alpha:  0.16,        // resting brightness
    left:  { x: 1200, y: 1323 },
    right: { x: 2739, y: 1259 }
  },

  // --- audio bars ---
  bars: {
    count:  14,
    width:  110,         // total width of a bar group
    height: 250,         // height at full volume
    tiltLeft:  -7,       // degrees. negative leans left, positive leans right
    tiltRight:   6,
    left:  { x: 1270, y: 1600 },
    right: { x: 2690, y: 1545 }
  },

  // --- droplets running down the glass ---
  drops: {
    count:   55,
    minSize: 4,          // was 7-26, which read as too big
    maxSize: 15
  },

  // --- rising smoke: incense stick and the mug ---
  smoke: {
    incense: { x: 1241, y: 1117, count: 22, size: 5,   rise: 0.9, alpha: 0.15 },
    mug:     { x: 2044, y: 1917, count: 16, size: 3.5, rise: 0.6, alpha: 0.13 }
  },

  // --- birds drifting across the sky ---
  birds: {
    count: 5,
    y:     393,          // anchor height from scene.json
    yWander: 190,        // vertical spread between birds
    size:  108,
    speed: 1.5,
    flip:  true,         // scene.json has scale -1 on x, so mirrored
    alpha: 85            // 0-100 percent. 100 = fully solid, 0 = invisible
  }
};

// ---------------------------------------------------------------------------
// Assets
// ---------------------------------------------------------------------------
var SRC = {
  daySky:    ASSET_BASE + 'bg_day.webp',            // sky strip, sits behind everything
  nightSky:  ASSET_BASE + 'bg_night.webp',
  clouds:    ASSET_BASE + 'clouds2.webp',
  dayFar:    ASSET_BASE + 'bg_day_mountain.webp',   // through-window view
  nightFar:  ASSET_BASE + 'bg_night_mountain.webp',
  dayRoom:   ASSET_BASE + 'bg_day_mask.webp',       // room foreground, glass is alpha
  nightRoom: ASSET_BASE + 'bg_night_mask.webp',
  fire:      ASSET_BASE + 'fire_sheet.webp',        // 6x4, 24 frames
  lamp:      ASSET_BASE + 'lamp_sheet.webp',        // 7x7, 49 frames
  birds:     ASSET_BASE + 'birds.webp',             // 4x4, 16 frames
  snow:      ASSET_BASE + 'snowflake.webp'
};
var img = {}, loaded = 0, total = 0;
for (var k in SRC) {
  total++;
  (function (key) {
    var im = new Image();
    im.onload  = function () { loaded++; };
    im.onerror = function () { loaded++; im.failed = true; };
    im.src = SRC[key];
    img[key] = im;
  })(k);
}

// Sprite sheets, straight from each texture's TEXS block
var SHEET = {
  fire:  { cols: 6, rows: 4, count: 24, fw: 111, fh: 138, frameMs: 30 },
  lamp:  { cols: 7, rows: 7, count: 49, fw: 59,  fh: 162, frameMs: 40 },
  birds: { cols: 4, rows: 4, count: 16, fw: 129, fh: 129, frameMs: 62.5 }
};

// ---------------------------------------------------------------------------
// Canvas
// ---------------------------------------------------------------------------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, scale = 1, ox = 0, oy = 0;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.max(W / SCENE_W, H / SCENE_H);   // cover-fit
  ox = (W - SCENE_W * scale) / 2;
  oy = (H - SCENE_H * scale) / 2;
}
function sx(x) { return ox + x * scale; }
function sy(y) { return oy + y * scale; }
function ss(v) { return v * scale; }

// Draw a sprite-sheet frame centred on a scene coordinate.
function drawSprite(im, sheet, frame, cx, cy, mul) {
  if (!im || im.failed) return;
  var col = frame % sheet.cols, row = Math.floor(frame / sheet.cols);
  var w = sheet.fw * mul, h = sheet.fh * mul;
  ctx.drawImage(im,
    col * sheet.fw, row * sheet.fh, sheet.fw, sheet.fh,
    sx(cx - w / 2), sy(cy - h / 2), ss(w), ss(h));
}

// ---------------------------------------------------------------------------
// Easter egg: clicking the mug forces snow. Click again to go back to
// whatever the weather property says.
// ---------------------------------------------------------------------------
var weatherOverride = null;   // null = follow settings.weather
var lastToggle = 0;
var eggFlash = 0;             // brief visual confirmation of a hit

function currentWeather() {
  return weatherOverride === null ? settings.weather : weatherOverride;
}

// screen pixels -> scene coordinates (the inverse of sx/sy)
function toScene(clientX, clientY) {
  return { x: (clientX - ox) / scale, y: (clientY - oy) / scale };
}

function tryToggle(clientX, clientY) {
  if (!TUNE.easter.enabled) return;
  var now = performance.now();
  if (now - lastToggle < 300) return;        // both listeners can fire; debounce

  var p = toScene(clientX, clientY);
  var dx = p.x - TUNE.easter.x, dy = p.y - TUNE.easter.y;
  if (dx * dx + dy * dy > TUNE.easter.radius * TUNE.easter.radius) return;

  lastToggle = now;
  weatherOverride = (weatherOverride === null) ? 1 : null;   // 1 = snow
  eggFlash = 1;
}

function onPointer(e) { tryToggle(e.clientX, e.clientY); }
window.addEventListener('click', onPointer);
window.addEventListener('pointerdown', onPointer);

// ---------------------------------------------------------------------------
// Day / night
// ---------------------------------------------------------------------------
var nightBlend = 0;

function targetNight() {
  if (settings.timeofday === 1) return 0;
  if (settings.timeofday === 2) return 1;
  var now = new Date();
  var h = now.getHours() + now.getMinutes() / 60;
  var d = settings.dayTime, n = settings.nightTime;
  var isNight = (d < n) ? (h < d || h >= n) : (h < d && h >= n);
  return isNight ? 1 : 0;
}

// ---------------------------------------------------------------------------
// Positions from scene.json
// ---------------------------------------------------------------------------
var POS = {
  sky:     { x: 1920, y: 513,  w: 3840, h: 1026 },  // origin 1920,1647
  // clock, bars and rings now live in TUNE at the top of the file
  fire:    { x: 3349, y: 1338, mul: 1.33 },   // origin 3349.22, 822
  lamp:    { x: 2842, y: 1186, mul: 1.33 },   // origin 2842.43, 973.61
  stove:   { x: 3396, y: 1317 },
  bulb:    { x: 1470, y: 1180 }
};

// ---------------------------------------------------------------------------
// Particles (scene coordinates)
// ---------------------------------------------------------------------------
function rnd(a, b) { return a + Math.random() * (b - a); }

var rain = [], snow = [], glass = [], motes = [], embers = [], smoke = [], birds = [];

function newDrop() {
  return { x: rnd(0, SCENE_W), y: rnd(0, SCENE_H * 0.7),
           r: rnd(TUNE.drops.minSize, TUNE.drops.maxSize), sp: 0, hold: rnd(0, 220) };
}
// One smoke puff for a given emitter (incense stick or mug).
function newSmoke(src) {
  return { src: src,
           x: src.x + rnd(-5, 5), y: src.y,
           r: rnd(src.size * 0.7, src.size * 1.4),
           life: 1, sp: rnd(src.rise * 0.7, src.rise * 1.4),
           ph: rnd(0, 6.28), wob: rnd(0.6, 1.5) };
}
function newBird(startX) {
  return { x: startX,
           y: TUNE.birds.y + rnd(-TUNE.birds.yWander, TUNE.birds.yWander),
           sp: TUNE.birds.speed * rnd(0.75, 1.3),
           sz: TUNE.birds.size * rnd(0.7, 1.15),
           ph: rnd(0, 6.28),
           off: Math.floor(rnd(0, SHEET.birds.count)) };
}
function initParticles() {
  rain = []; snow = []; glass = []; motes = []; embers = []; smoke = [];
  for (var i = 0; i < 260; i++)
    rain.push({ x: rnd(-200, SCENE_W), y: rnd(0, SCENE_H),
                len: rnd(38, 120), sp: rnd(38, 66), w: rnd(1.2, 2.6) });
  for (var j = 0; j < 190; j++)
    snow.push({ x: rnd(0, SCENE_W), y: rnd(0, SCENE_H), r: rnd(5, 17),
                sp: rnd(3.2, 8), dr: rnd(-1.4, 1.4), ph: rnd(0, 6.28) });
  for (var g = 0; g < TUNE.drops.count; g++) glass.push(newDrop());
  for (var m = 0; m < 90; m++)
    motes.push({ x: rnd(0, SCENE_W), y: rnd(500, SCENE_H), r: rnd(2, 6.5),
                 ph: rnd(0, 6.28), sp: rnd(0.25, 0.9), a: rnd(0.15, 0.5) });
  for (var e = 0; e < 26; e++)
    embers.push({ x: rnd(3300, 3480), y: rnd(1100, 1330), r: rnd(2, 5),
                  sp: rnd(1.2, 3.4), life: Math.random() });
  var src, s, p;
  for (src in TUNE.smoke) {
    for (s = 0; s < TUNE.smoke[src].count; s++) {
      p = newSmoke(TUNE.smoke[src]);
      p.life = Math.random();
      smoke.push(p);
    }
  }
  for (var b = 0; b < TUNE.birds.count; b++)
    birds.push(newBird(rnd(-400, SCENE_W)));
}

// ---------------------------------------------------------------------------
// Audio
// ---------------------------------------------------------------------------
var fft = new Array(128); for (var q = 0; q < 128; q++) fft[q] = 0;
var bass = 0, audioPeak = 0.05, audioOK = false;

function onAudio(a) {
  audioOK = true;
  for (var i = 0; i < 128; i++) fft[i] = fft[i] * 0.6 + a[i] * 0.4;
  var s = 0;
  for (var b = 0; b < 16; b++) s += a[b] + a[b + 64];
  var v = s / 32;
  if (v > audioPeak) audioPeak = v;
  var lv = Math.min((v / audioPeak) * settings.sensitivity, 1);
  if (lv > bass) bass = lv;
}
// Wallpaper Engine path (only exists when running as a WE wallpaper).
(function reg(t) {
  if (window.wallpaperRegisterAudioListener) window.wallpaperRegisterAudioListener(onAudio);
  else if ((t || 0) < 40) setTimeout(function () { reg((t || 0) + 1); }, 250);
})(0);

// ---------------------------------------------------------------------------
// Web Audio path (browser). Produces the same 128-value array WE sends:
// bins 0-63 = left channel, 64-127 = right, low frequency first.
// Browsers block audio until the user interacts, so this starts on the
// first click anywhere on the page.
// ---------------------------------------------------------------------------
var audioStarted = false, audioNote = null;

function pumpAnalysers(anL, anR) {
  var n = 64;
  var bufL = new Uint8Array(anL.frequencyBinCount);
  var bufR = new Uint8Array(anR.frequencyBinCount);
  var out = new Array(128);

  (function tick() {
    anL.getByteFrequencyData(bufL);
    anR.getByteFrequencyData(bufR);
    // The useful musical range sits in the lower part of the spectrum,
    // so sample the first half of the bins rather than the whole array.
    for (var i = 0; i < n; i++) {
      var j = Math.floor(i * (bufL.length * 0.5) / n);
      out[i]     = bufL[j] / 255;
      out[i + n] = bufR[j] / 255;
    }
    onAudio(out);
    requestAnimationFrame(tick);
  })();
}

function startWebAudio() {
  if (audioStarted || !TUNE.webAudio.enabled) return;
  if (window.wallpaperRegisterAudioListener) return;   // WE is driving instead
  audioStarted = true;

  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ac = new AC();

  var splitter = ac.createChannelSplitter(2);
  var anL = ac.createAnalyser(), anR = ac.createAnalyser();
  anL.fftSize = anR.fftSize = 256;
  anL.smoothingTimeConstant = anR.smoothingTimeConstant = 0.75;
  splitter.connect(anL, 0);
  splitter.connect(anR, 1);

  function attach(node, playThrough) {
    node.connect(splitter);
    if (playThrough) node.connect(ac.destination);
    ac.resume();
    pumpAnalysers(anL, anR);
    hideNote();
  }

  if (TUNE.webAudio.source === 'mic') {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) { attach(ac.createMediaStreamSource(stream), false); })
      .catch(function () { audioStarted = false; });   // permission denied
  } else {
    var el = new Audio(TUNE.webAudio.file);
    el.loop = true;
    el.crossOrigin = 'anonymous';
    el.volume = TUNE.webAudio.volume;
    el.play().then(function () {
      attach(ac.createMediaElementSource(el), true);
    }).catch(function () { audioStarted = false; });   // missing/blocked file
  }
}

function hideNote() {
  if (audioNote) { audioNote.style.opacity = '0'; }
}

// A small one-time hint, since the page needs a click before audio can start.
if (TUNE.webAudio.enabled && TUNE.webAudio.hint) {
  audioNote = document.createElement('div');
  audioNote.textContent = TUNE.webAudio.source === 'mic'
    ? 'click to enable microphone reactivity'
    : 'click for music';
  audioNote.style.cssText =
    'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
    'font:14px system-ui,sans-serif;color:rgba(255,255,255,0.55);' +
    'letter-spacing:.04em;pointer-events:none;transition:opacity 1s;z-index:9';
  document.body.appendChild(audioNote);
  setTimeout(hideNote, 12000);
}

window.addEventListener('click', startWebAudio);

function drawBars(p, flip, tilt) {
  var B = TUNE.bars;
  var n = B.count, bw = B.width / n;

  // rotate the whole group around its own base so it leans like the
  // original's perspective effect
  ctx.save();
  ctx.translate(sx(p.x), sy(p.y));
  ctx.rotate(tilt * Math.PI / 180);

  for (var i = 0; i < n; i++) {
    var v = audioOK ? Math.min(fft[i + (flip ? 64 : 0)] * 2.2, 1) : 0;
    var h = 12 + v * (B.height - 12);
    var x = ss(-B.width / 2 + i * bw);
    var grd = ctx.createLinearGradient(0, 0, 0, ss(-h));
    grd.addColorStop(0, 'rgba(0,165,255,0.15)');
    grd.addColorStop(1, 'rgba(120,220,255,0.85)');
    ctx.fillStyle = grd;
    ctx.fillRect(x, ss(-h), ss(bw * 0.62), ss(h));
  }
  ctx.restore();
}

// Waveform ring: radius is modulated by the spectrum around the circle,
// which reads much closer to the original's audio_ring effect than a
// plain stroked circle did.
function drawRing(p, flip) {
  var R = TUNE.ring;
  var seg = 72;
  ctx.beginPath();
  for (var i = 0; i <= seg; i++) {
    var ang = (i / seg) * Math.PI * 2 - Math.PI / 2;
    var bin = Math.floor((i % seg) / seg * 32) + (flip ? 64 : 0);
    var v = audioOK ? Math.min(fft[bin] * 2.0, 1) : 0;
    var r = R.radius * (0.92 + v * R.wobble);
    var px = sx(p.x + Math.cos(ang) * r);
    var py = sy(p.y + Math.sin(ang) * r);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(130,225,255,' + (R.alpha + (audioOK ? bass : 0) * 0.38) + ')';
  ctx.lineWidth = ss(2.5 + (audioOK ? bass : 0) * 4);
  ctx.stroke();
}

function glow(x, y, r, color, a) {
  var g = ctx.createRadialGradient(sx(x), sy(y), 0, sx(x), sy(y), ss(r));
  g.addColorStop(0, color.replace('%A%', a));
  g.addColorStop(1, color.replace('%A%', 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(sx(x), sy(y), ss(r), 0, Math.PI * 2);
  ctx.fill();
}

function drawClock() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes(), suffix = '';
  if (!settings.use24h) {
    suffix = h >= 12 ? ' PM' : ' AM';
    h = h % 12; if (h === 0) h = 12;
  }
  var txt = (settings.use24h ? (h < 10 ? '0' + h : h) : h) +
            ':' + (m < 10 ? '0' + m : m) + suffix;
  var C = TUNE.clock;
  ctx.save();
  ctx.textAlign = C.align;
  ctx.textBaseline = 'middle';
  ctx.font = C.weight + ' ' + ss(C.size) + 'px "' + C.font + '", Helvetica, Arial, sans-serif';
  if (C.shadow > 0) {
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = ss(C.shadow);
  }
  ctx.fillStyle = C.color;
  ctx.fillText(txt, sx(C.x), sy(C.y));
  ctx.restore();
}

// Shows where the mug click target sits, so it can be aimed precisely.
function drawEasterDebug() {
  var E = TUNE.easter;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,255,180,0.9)';
  ctx.lineWidth = ss(4);
  ctx.beginPath();
  ctx.arc(sx(E.x), sy(E.y), ss(E.radius), 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(120,255,180,0.9)';
  ctx.font = ss(46) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('mug ' + Math.round(E.x) + ',' + Math.round(E.y),
               sx(E.x), sy(E.y - E.radius - 30));
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
var last = performance.now(), t = 0, elapsed = 0;

function frame(now) {
  var ms = Math.min(now - last, 100);
  var dt = ms / 16.667;
  last = now;
  t += dt;
  elapsed += ms;

  if (loaded < total) {
    ctx.fillStyle = '#0b1016';
    ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
    return;
  }

  nightBlend += (targetNight() - nightBlend) * 0.01 * dt;
  var nb = nightBlend;
  var dw = SCENE_W * scale, dh = SCENE_H * scale;
  var i, p;

  ctx.fillStyle = '#0b1016';
  ctx.fillRect(0, 0, W, H);

  // --- 1. sky, at the very back ------------------------------------------
  var skyX = sx(POS.sky.x - POS.sky.w / 2), skyY = sy(POS.sky.y - POS.sky.h / 2);
  ctx.globalAlpha = 1;
  ctx.drawImage(img.daySky, skyX, skyY, ss(POS.sky.w), ss(POS.sky.h));
  if (nb > 0.001) {
    ctx.globalAlpha = nb;
    ctx.drawImage(img.nightSky, skyX, skyY, ss(POS.sky.w), ss(POS.sky.h));
  }
  ctx.globalAlpha = 1;

  // --- 2. drifting clouds -------------------------------------------------
  if (!img.clouds.failed) {
    var cw = SCENE_W, ch = SCENE_H;
    var drift = (t * 0.16) % cw;
    ctx.globalAlpha = 0.55 - nb * 0.2;
    ctx.drawImage(img.clouds, sx(-drift), sy(-1066), ss(cw), ss(ch));
    ctx.drawImage(img.clouds, sx(cw - drift), sy(-1066), ss(cw), ss(ch));
    ctx.globalAlpha = 1;
  }

  // --- 3. through-window view --------------------------------------------
  ctx.drawImage(img.dayFar, ox, oy, dw, dh);
  if (nb > 0.001) {
    ctx.globalAlpha = nb;
    ctx.drawImage(img.nightFar, ox, oy, dw, dh);
    ctx.globalAlpha = 1;
  }

  // --- 3b. birds, in the sky behind the glass -----------------------------
  if (!img.birds.failed) {
    for (i = 0; i < birds.length; i++) {
      p = birds[i];
      p.x += p.sp * dt;
      p.y += Math.sin(t * 0.01 + p.ph) * 0.35 * dt;
      if (p.x > SCENE_W + 300) birds[i] = newBird(-400);

      var bf = (Math.floor(elapsed / SHEET.birds.frameMs) + p.off) % SHEET.birds.count;
      var bc = bf % SHEET.birds.cols, br = Math.floor(bf / SHEET.birds.cols);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(TUNE.birds.alpha, 100)) / 100;
      ctx.translate(sx(p.x), sy(p.y));
      if (TUNE.birds.flip) ctx.scale(-1, 1);
      ctx.drawImage(img.birds,
        bc * SHEET.birds.fw, br * SHEET.birds.fh, SHEET.birds.fw, SHEET.birds.fh,
        ss(-p.sz / 2), ss(-p.sz / 2), ss(p.sz), ss(p.sz));
      ctx.restore();
    }
  }

  // --- 4. falling weather, seen through the glass -------------------------
  if (currentWeather() === 0) {
    ctx.strokeStyle = 'rgba(200,225,245,0.45)';
    ctx.lineCap = 'round';
    for (i = 0; i < rain.length; i++) {
      p = rain[i];
      p.y += p.sp * dt; p.x += p.sp * 0.22 * dt;
      if (p.y > SCENE_H) { p.y = -p.len; p.x = rnd(-200, SCENE_W); }
      ctx.lineWidth = ss(p.w);
      ctx.beginPath();
      ctx.moveTo(sx(p.x), sy(p.y));
      ctx.lineTo(sx(p.x - p.len * 0.22), sy(p.y - p.len));
      ctx.stroke();
    }
  } else if (currentWeather() === 1) {
    ctx.fillStyle = 'rgba(235,245,255,0.85)';
    for (i = 0; i < snow.length; i++) {
      p = snow[i];
      p.y += p.sp * dt;
      p.x += (Math.sin(t * 0.012 + p.ph) * 1.5 + p.dr) * dt;
      if (p.y > SCENE_H) { p.y = -20; p.x = rnd(0, SCENE_W); }
      if (img.snow.failed) {
        ctx.beginPath();
        ctx.arc(sx(p.x), sy(p.y), ss(p.r * 0.45), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.drawImage(img.snow, sx(p.x - p.r), sy(p.y - p.r), ss(p.r * 2), ss(p.r * 2));
      }
      ctx.globalAlpha = Math.max(0, Math.min(25, 100)) / 100;
    }
  }

  // --- 5. droplets on the glass -- BEHIND the room, like objects 15-17 ----
  if (currentWeather() === 0) {
    for (i = 0; i < glass.length; i++) {
      p = glass[i];
      if (p.hold > 0) { p.hold -= dt; }
      else {
        p.sp += 0.06 * dt;
        p.y += p.sp * dt;
        ctx.fillStyle = 'rgba(210,232,248,0.10)';
        ctx.fillRect(sx(p.x - p.r * 0.12), sy(p.y - p.sp * 8),
                     ss(p.r * 0.24), ss(p.sp * 8));
      }
      ctx.fillStyle = 'rgba(215,235,250,0.20)';
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), ss(p.r * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.beginPath();
      ctx.arc(sx(p.x - p.r * 0.15), sy(p.y - p.r * 0.15), ss(p.r * 0.16), 0, Math.PI * 2);
      ctx.fill();
      if (p.y > SCENE_H) glass[i] = newDrop();
    }
  }

  // --- 6. room foreground (glass is transparent here) ---------------------
  ctx.drawImage(img.dayRoom, ox, oy, dw, dh);
  if (nb > 0.001) {
    ctx.globalAlpha = nb;
    ctx.drawImage(img.nightRoom, ox, oy, dw, dh);
    ctx.globalAlpha = 1;
  }

  // --- 7. animated sprites, in front of the room --------------------------
  var lampFrame = Math.floor(elapsed / SHEET.lamp.frameMs) % SHEET.lamp.count;
  drawSprite(img.lamp, SHEET.lamp, lampFrame, POS.lamp.x, POS.lamp.y, POS.lamp.mul);

  var fireFrame = Math.floor(elapsed / SHEET.fire.frameMs) % SHEET.fire.count;
  drawSprite(img.fire, SHEET.fire, fireFrame, POS.fire.x, POS.fire.y, POS.fire.mul);

  // --- 8. light, embers, smoke, dust --------------------------------------
  ctx.globalCompositeOperation = 'lighter';

  var flick = 0.72 + Math.sin(t * 0.09) * 0.12 + Math.random() * 0.16;
  glow(POS.stove.x, POS.stove.y, 470, 'rgba(255,140,90,%A%)', (0.26 + 0.10 * nb) * flick);
  glow(POS.bulb.x, POS.bulb.y, 620, 'rgba(255,196,120,%A%)', 0.12 + 0.10 * nb);
  glow(POS.lamp.x, POS.lamp.y, 210, 'rgba(255,120,80,%A%)', 0.16 + 0.10 * nb);

  for (i = 0; i < embers.length; i++) {
    p = embers[i];
    p.y -= p.sp * dt;
    p.x += Math.sin(t * 0.03 + p.life * 6) * 0.7 * dt;
    p.life -= 0.004 * dt;
    if (p.life <= 0) { p.x = rnd(3320, 3470); p.y = rnd(1240, 1330); p.life = 1; }
    ctx.fillStyle = 'rgba(255,170,70,' + (p.life * 0.75) + ')';
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), ss(p.r), 0, Math.PI * 2);
    ctx.fill();
  }

  for (i = 0; i < motes.length; i++) {
    p = motes[i];
    p.x += Math.sin(t * 0.008 + p.ph) * 0.55 * dt;
    p.y -= p.sp * 0.2 * dt;
    if (p.y < 300) { p.y = SCENE_H + 20; p.x = rnd(0, SCENE_W); }
    var tw = p.a * (0.55 + 0.45 * Math.sin(t * 0.05 + p.ph));
    ctx.fillStyle = 'rgba(255,232,190,' + tw + ')';
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), ss(p.r), 0, Math.PI * 2);
    ctx.fill();
  }

  if (settings.bars && settings.audioReact) {
    drawBars(TUNE.bars.left, false, TUNE.bars.tiltLeft);
    drawBars(TUNE.bars.right, true, TUNE.bars.tiltRight);
    drawRing(TUNE.ring.left, false);
    drawRing(TUNE.ring.right, true);
  }

  ctx.globalCompositeOperation = 'source-over';

  // Smoke from the incense stick and the mug. Drawn as tall, sheared
  // ellipses that stretch as they rise, which reads as a wisp rather
  // than the cartoon circles it was before.
  for (i = 0; i < smoke.length; i++) {
    p = smoke[i];
    p.y -= p.sp * dt;
    var sway = Math.sin(t * 0.022 + p.ph) * p.wob;
    p.x += sway * dt;
    p.r += 0.06 * dt;
    p.life -= 0.0035 * dt;
    if (p.life <= 0) { smoke[i] = newSmoke(p.src); continue; }

    // fade in at the source, out at the top
    var fade = Math.min(p.life, 1 - p.life) * 2;
    ctx.save();
    ctx.translate(sx(p.x), sy(p.y));
    ctx.rotate(sway * 0.16);
    ctx.scale(1, 1.9 + (1 - p.life) * 2.2);       // stretch vertically
    ctx.fillStyle = 'rgba(226,226,226,' + (fade * p.src.alpha) + ')';
    ctx.beginPath();
    ctx.arc(0, 0, ss(p.r), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // --- 9. clock ------------------------------------------------------------
  if (settings.clock) drawClock();

  // brief ripple at the mug to confirm the easter egg registered
  if (eggFlash > 0) {
    eggFlash -= 0.02 * dt;
    ctx.save();
    ctx.strokeStyle = 'rgba(220,245,255,' + (eggFlash * 0.55) + ')';
    ctx.lineWidth = ss(5);
    ctx.beginPath();
    ctx.arc(sx(TUNE.easter.x), sy(TUNE.easter.y),
            ss(TUNE.easter.radius * (1.3 - eggFlash * 0.8)), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (TUNE.easter.debug) drawEasterDebug();

  bass *= Math.pow(0.90, dt);
  audioPeak = Math.max(audioPeak * Math.pow(0.999, dt), 0.02);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
initParticles();
nightBlend = targetNight();
requestAnimationFrame(frame);

// ---------------------------------------------------------------------------
// Wallpaper Engine properties
// ---------------------------------------------------------------------------
window.wallpaperPropertyListener = {
  applyUserProperties: function (p) {
    if (p.timeofday)   settings.timeofday   = parseInt(p.timeofday.value, 10);
    if (p.daytime)     settings.dayTime     = p.daytime.value;
    if (p.nighttime)   settings.nightTime   = p.nighttime.value;
    if (p.weather)     settings.weather     = parseInt(p.weather.value, 10);
    if (p.clock)       settings.clock       = p.clock.value;
    if (p._24hrs)      settings.use24h      = p._24hrs.value;
    if (p.bar)         settings.bars        = p.bar.value;
    if (p.audioreact)  settings.audioReact  = p.audioreact.value;
    if (p.sensitivity) settings.sensitivity = p.sensitivity.value / 100;
  },
  applyGeneralProperties: function () {}
};
</script>
</body>
</html>
