<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senveau - Stoik Sözler</title>
    <link rel="stylesheet" href="../styles/senveau.css" />
  </head>
  <body>
    <div class="arka-plan" id="arka-plan"></div>
    <main class="card">
      <blockquote id="soz">Yükleniyor…</blockquote>
      <div class="yazar" id="yazar"></div>
      <div class="aciklama" id="aciklama"></div>
      <button class="ai-btn" id="ai-acikla" type="button" hidden>
        AI ile açıkla
      </button>
      <button
        class="yenile-btn"
        id="yenile"
        type="button"
        aria-label="Yeni söz getir"
        title="Yeni söz"
      >
        ↻
      </button>
    </main>
    <script src="../scripts/senveau.js"></script>
  </body>
